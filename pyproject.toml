[project]
name = "danterodia"
version = "2.0.0.dev0"
description = "Herramienta OSINT modular con foco en fuentes españolas (BOE, BORME, contratación pública, INE, prensa). Basada en Dante's Gates Minimal Version de Quantika14."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Jorge Coronado (Quantika14)", email = "jorge.coronado@quantika14.com" },
]
keywords = ["osint", "socmint", "boe", "borme", "investigación", "españa"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "httpx[http2,socks]>=0.28",
    "certifi>=2024.8.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlmodel>=0.0.22",
    "typer>=0.15",
    "rich>=13.9",
    "networkx>=3.4,<4",
    "jinja2>=3.1.4",
    "platformdirs>=4.3",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "dnspython>=2.7",
    "email-validator>=2.2",
    "phonenumbers>=8.13",
    "rapidfuzz>=3.10",
    "pypdf>=5.1",
    "tldextract>=5.1",
    "ddgs>=9.0",
    "newspaper4k>=0.9.3",
]

[project.optional-dependencies]
mongo = ["pymongo>=4.10"]

[project.scripts]
danterodia = "danterodia.cli:app"

[project.entry-points."danterodia.sources"]
# Sin conexión
ine = "danterodia.sources.ine:IneFrecuencia"
identificadores = "danterodia.sources.offline:Identificadores"
telefono = "danterodia.sources.offline:Telefono"
email = "danterodia.sources.offline:EmailBasico"
politicos_judicial = "danterodia.sources.offline:PoliticosCasosJudiciales"
# Fuentes oficiales españolas (índice local)
boe = "danterodia.sources.oficiales:Boe"
borme = "danterodia.sources.oficiales:Borme"
contratacion = "danterodia.sources.oficiales:Contratacion"
indultos = "danterodia.sources.oficiales:Indultos"
documentos_locales = "danterodia.sources.oficiales:DocumentosLocales"
# Identidad y cuentas
wikidata = "danterodia.sources.wikidata:Wikidata"
whatsmyname = "danterodia.sources.cuentas:WhatsMyName"
dns = "danterodia.sources.cuentas:DnsCorreo"
gravatar = "danterodia.sources.cuentas:Gravatar"
pgp = "danterodia.sources.cuentas:Pgp"
hibp = "danterodia.sources.cuentas:Hibp"
emailrep = "danterodia.sources.cuentas:EmailRep"
# Dominios e IP
rdap = "danterodia.sources.infraestructura:Rdap"
crtsh = "danterodia.sources.infraestructura:CrtSh"
wayback = "danterodia.sources.infraestructura:Wayback"
tecnologias = "danterodia.sources.infraestructura:Tecnologias"
ipinfo = "danterodia.sources.infraestructura:IpInfo"
shodan = "danterodia.sources.infraestructura:Shodan"
censys = "danterodia.sources.infraestructura:Censys"
# Web y prensa
buscadores = "danterodia.sources.web:Buscadores"
prensa = "danterodia.sources.web:Prensa"
verificar_noticia = "danterodia.sources.web:VerificarNoticia"

[project.urls]
"Proyecto original" = "https://github.com/Quantika14/osint-suite-tools"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pip-audit>=2.7",
    "uv>=0.5",
    "pymongo>=4.10",
    "mongomock>=4.2",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/danterodia"]
artifacts = ["src/danterodia/data/**/*", "src/danterodia/reports/templates/*"]

# ---------------------------------------------------------------- calidad

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle + pyflakes
    "I",             # orden de imports
    "B",             # bugbear (errores típicos)
    "UP",            # sintaxis moderna
    "S",             # bandit (seguridad)
    "BLE",           # prohíbe `except Exception` ciego
    "ASYNC",         # errores de asyncio
    "SIM", "RUF", "PTH", "DTZ",  # simplificaciones, pathlib, fechas con zona horaria
]
ignore = ["RUF001", "RUF002", "RUF003"]  # permitimos tildes y comillas tipográficas

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E501"]  # los datos de prueba pueden ser largos
# `timeout` aquí es el timeout HTTP de httpx por petición, no un timeout de asyncio.
"src/danterodia/http.py" = ["ASYNC109"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/danterodia", "tests"]
exclude = ["legacy/"]

[[tool.mypy.overrides]]
module = ["networkx", "networkx.*", "lxml", "lxml.*", "newspaper", "newspaper.*", "ddgs", "ddgs.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["danterodia"]
branch = true

[tool.coverage.report]
fail_under = 70  # mínimo exigido en la Fase 4; hoy está por encima del 90 %
show_missing = true
skip_covered = true
