[project]
name = "osintsuite"
version = "2.0.0.dev0"
description = "Herramienta OSINT modular con foco en fuentes españolas (BOE, BORME, contratación pública, INE, prensa). Basada en Dante's Gates Minimal Version de Quantika14."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Jorge Coronado (Quantika14)", email = "jorge.coronado@quantika14.com" },
]
keywords = ["osint", "socmint", "boe", "borme", "investigación", "españa"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "httpx[http2,socks]>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlmodel>=0.0.22",
    "typer>=0.15",
    "rich>=13.9",
    "networkx>=3.4,<4",
    "jinja2>=3.1.4",
    "platformdirs>=4.3",
]

[project.optional-dependencies]
mongo = ["pymongo>=4.10"]

[project.scripts]
osint = "osintsuite.cli:app"

[project.entry-points."osintsuite.sources"]
ine = "osintsuite.sources.ine:IneFrecuencia"

[project.urls]
"Proyecto original" = "https://github.com/Quantika14/osint-suite-tools"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osintsuite"]

# ---------------------------------------------------------------- calidad

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle + pyflakes
    "I",             # orden de imports
    "B",             # bugbear (errores típicos)
    "UP",            # sintaxis moderna
    "S",             # bandit (seguridad)
    "BLE",           # prohíbe `except Exception` ciego
    "ASYNC",         # errores de asyncio
    "SIM", "RUF", "PTH", "DTZ",  # simplificaciones, pathlib, fechas con zona horaria
]
ignore = ["RUF001", "RUF002", "RUF003"]  # permitimos tildes y comillas tipográficas

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/osintsuite", "tests"]
exclude = ["legacy/"]

[[tool.mypy.overrides]]
module = ["networkx", "networkx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["osintsuite"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
