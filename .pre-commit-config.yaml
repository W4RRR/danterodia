# Instalar: uv run pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(legacy|data|src/osintsuite/data|tests/fixtures)/
      - id: end-of-file-fixer
        exclude: ^(legacy|data|src/osintsuite/data|tests/fixtures)/
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=2048"]
        exclude: ^(legacy|data|src/osintsuite/data|tests/fixtures)/
      - id: detect-private-key
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: system
        types: [python]
        exclude: ^legacy/
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
        exclude: ^legacy/
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        pass_filenames: false
        types: [python]
